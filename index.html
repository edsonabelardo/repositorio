<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>David &amp; Cleny · Comparte tus fotos</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400;1,500&family=Jost:wght@300;400;500&display=swap" rel="stylesheet">
<style>
body{margin:0;background:#f7f3ec;}
a{color:#5b6440;}a:hover{color:#2b2a24;}
textarea,input{font:inherit;}
</style>
</helmet>
<div style="min-height:100vh;background:#f7f3ec;color:#2b2a24;font-family:Jost,sans-serif;">
  <div style="max-width:480px;margin:0 auto;">
    <div style="padding:28px 22px 0;display:flex;flex-direction:column;align-items:center;gap:18px;">
      <div style="font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#5b6440;">Nuestra boda</div>
      <div style="width:100%;aspect-ratio:4/5;border-radius:180px 180px 6px 6px;overflow:hidden;background:#e3dccd;">
        <img src="assets/hero1.jpg" alt="David y Cleny" style="width:100%;height:100%;object-fit:cover;object-position:50% 70%;display:block;">
      </div>
      <div style="display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center;">
        <div style="font-family:'Cormorant Garamond',serif;font-style:italic;font-size:48px;line-height:1;">David <span style="color:#b89a62;">&amp;</span> Cleny</div>
        <div style="display:flex;align-items:center;gap:12px;font-size:13px;letter-spacing:.28em;color:#5e594d;margin-top:6px;">
          <span style="width:28px;height:1px;background:#b89a62;"></span>28 · 11 · 2026<span style="width:28px;height:1px;background:#b89a62;"></span>
        </div>
        <div style="font-size:13px;color:#7a7466;">Salón Multiusos Pillao Matao</div>
      </div>
      <p style="font-family:'Cormorant Garamond',serif;font-size:20px;line-height:1.4;text-align:center;margin:4px 6px 0;text-wrap:pretty;">Cada foto que tomes hoy es un recuerdo que guardaremos para siempre. Compártela con nosotros.</p>
    </div>

    <div style="margin:26px 16px 0;display:flex;flex-direction:column;gap:12px;">
      <button onClick="{{ upload }}" style="all:unset;cursor:pointer;text-align:center;background:#5b6440;color:#fffdf8;border-radius:999px;padding:18px;font-size:16px;font-weight:500;letter-spacing:.04em;" style-hover="background:#4a5234;">{{ label }}</button>
      <sc-if value="{{ opened }}" hint-placeholder-val="{{ false }}">
        <div style="font-size:13px;line-height:1.5;color:#4a5234;background:#eef0e4;border-radius:12px;padding:12px 14px;text-align:center;">¡Gracias! En el álbum toca <b>Agregar fotos</b> y elige las tuyas.</div>
      </sc-if>
    </div>

    <div style="padding:30px 20px 40px;text-align:center;font-family:'Cormorant Garamond',serif;font-style:italic;font-size:18px;color:#7a7466;">Con amor, D &amp; C</div>
  </div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props="{&quot;albumUrl&quot;:{&quot;editor&quot;:&quot;text&quot;,&quot;default&quot;:&quot;https://photos.app.goo.gl/pnSdbARLDmgybS2A8&quot;,&quot;tsType&quot;:&quot;string&quot;},&quot;textoBoton&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;Compartir nuestros recuerdos&quot;,&quot;Sube tus fotos de la boda&quot;,&quot;Ver y compartir fotos&quot;,&quot;Subir a nuestro álbum&quot;],&quot;default&quot;:&quot;Compartir nuestros recuerdos&quot;,&quot;tsType&quot;:&quot;string&quot;}}">
class Component extends DCLogic {
  state = { opened: false, name: '', msg: '' };
  renderVals() {
    const st = this.state;
    const url = this.props.albumUrl || 'https://photos.app.goo.gl/pnSdbARLDmgybS2A8';
    return {
      ...st,
      label: this.props.textoBoton || 'Compartir nuestros recuerdos',
      upload: () => { window.open(url, '_blank', 'noopener'); this.setState({ opened: true }); }
    };
  }
}
</script>
</body>
</html>
